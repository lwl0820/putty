name: 套件 Windows 原生检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mit-abi:
    name: Windows x64 MIT 无凭据 ABI
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      TMP: ${{ github.workspace }}\.tmp\temp
      TEMP: ${{ github.workspace }}\.tmp\temp
    steps:
      - uses: actions/checkout@v4
      - name: 准备项目临时目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force .tmp/temp, .tmp/windows-ci/reports | Out-Null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 核对 MIT 文件与失败证据边界
        shell: pwsh
        run: |
          python -B -m unittest discover -s tools/suite/windows/tests -p test_private_data.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/suite/windows/gss_mit/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 纯提取固定 MIT 官方文件
        shell: pwsh
        run: |
          $sevenzip = (Get-Command 7z.exe -ErrorAction Stop).Source
          python -B tools/suite/windows/gss_mit/prepare_kfw.py --parent .tmp/windows-gss-mit --sevenzip "$sevenzip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 原生加载并核对私有配置
        shell: pwsh
        run: |
          python -B tools/suite/windows/gss_mit/probe.py --directory .tmp/windows-gss-mit/portable/bin --parent .tmp/windows-gss-mit --report .tmp/windows-ci/reports/gss-mit-abi.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: putty-suite-windows-mit-abi-evidence
          path: .tmp/windows-ci/reports/gss-mit-abi.json
          if-no-files-found: warn
  windows:
    name: Windows Server 2022 MSVC x64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PIP_CACHE_DIR: ${{ github.workspace }}\.tmp\pip-cache
      TMP: ${{ github.workspace }}\.tmp\temp
      TEMP: ${{ github.workspace }}\.tmp\temp
    steps:
      - uses: actions/checkout@v4
      - name: 准备项目临时目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force .tmp/temp, .tmp/windows-ci/reports | Out-Null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 固定构建工具版本
        run: python -m pip install cmake==3.30.9 ninja==1.11.1.1
      - name: 准备并验证受控 SSH 对端
        shell: pwsh
        run: |
          python -m venv .tmp/windows-ci/ssh-peer-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .tmp/windows-ci/ssh-peer-venv/Scripts/python.exe -m pip install -r tools/suite/windows/ssh_peer_tests/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .tmp/windows-ci/ssh-peer-venv/Scripts/python.exe -B -m unittest discover -s tools/suite/windows/ssh_peer_tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 检查公共脚本与证据拒绝门
        shell: pwsh
        run: |
          python -B -m unittest discover -s tools/qt/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/suite/windows/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/suite/windows/hive/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/suite/windows/storage/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 无 Qt 全关闭配置与构建
        shell: pwsh
        run: |
          cmake -S . -B .tmp/build/windows-off -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPUTTY_BUILD_PUTTYGEN=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-off --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 无 Qt CLI-only 多配置安装边界
        shell: pwsh
        run: |
          cmake -S . -B .tmp/build/windows-cli -G "Ninja Multi-Config" -DBUILD_TESTING=OFF -DPUTTY_BUILD_PUTTYGEN=OFF -DPUTTY_BUILD_PSFTP=ON -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-cli --config Debug --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 只有 Debug 时按 Release 安装必须失败，不允许拿错配置凑齐清单。
          cmake --install .tmp/build/windows-cli --config Release --prefix "$PWD/.tmp/windows-ci/install-missing-release"
          if ($LASTEXITCODE -eq 0) { throw "未构建 Release 却安装成功" }
          cmake --install .tmp/build/windows-cli --config Debug --prefix "$PWD/.tmp/windows-ci/install-debug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/suite/windows/check_build.py --build .tmp/build/windows-cli --prefix .tmp/windows-ci/install-debug --components psftp --configuration Debug --report install-debug.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-cli --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install .tmp/build/windows-cli --config Release --prefix "$PWD/.tmp/windows-ci/install-cli-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/suite/windows/check_build.py --build .tmp/build/windows-cli --prefix .tmp/windows-ci/install-cli-release --components psftp --configuration Release --report install-cli-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v4
        with:
          path: .tmp/qt
          key: qt-6.8.3-windows-msvc2022-x64-${{ hashFiles('tools/qt/qt-sources.json', 'tools/qt/build_qt.py') }}
      - name: 构建锁定 Qt 6.8.3
        shell: pwsh
        run: |
          if (!(Test-Path .tmp/qt/share/puttygen-gui/qt-sources/构建信息.json)) {
            python tools/qt/build_qt.py --prefix .tmp/qt --work .tmp/qt-build --jobs 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 构建共享运行时、两个 GUI 和三个 CLI
        shell: pwsh
        run: |
          cmake -S . -B .tmp/build/windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="$PWD/.tmp/qt" -DPython3_EXECUTABLE="$PWD/.tmp/windows-ci/ssh-peer-venv/Scripts/python.exe" -DPUTTY_BUILD_PUTTYGEN=OFF -DPUTTY_BUILD_RUNTIME=ON -DPUTTY_BUILD_PUTTY=ON -DPUTTY_BUILD_PAGEANT=ON -DPUTTY_BUILD_PLINK=ON -DPUTTY_BUILD_PSCP=ON -DPUTTY_BUILD_PSFTP=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($component in @('plink', 'pscp', 'psftp')) {
            cmake --install .tmp/build/windows-release --prefix "$PWD/.tmp/windows-ci/install-release" --component $component
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -B tools/suite/windows/check_build.py --build .tmp/build/windows-release --prefix .tmp/windows-ci/install-release --components plink pscp psftp --assertions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 执行原生事件、两个 GUI 宿主和受控存储并核对实际结果
        shell: pwsh
        run: |
          $env:PATH = "$PWD/.tmp/qt/bin;$env:PATH"
          # 仅诊断两个无存储宿主；直接打印退出码可区分加载失败与运行期异常。
          $env:QT_QPA_PLATFORM = 'offscreen'
          foreach ($probe in @('putty-terminal-cpu-tests.exe', 'putty-terminal-platform-tests.exe')) {
            & "$PWD/.tmp/build/windows-release/apps/putty/tests/$probe"
            Write-Host "终端无存储宿主 $probe 的实际退出码：$LASTEXITCODE"
          }
          # Windows 离屏插件使用 FreeType；正式测试显式使用系统字体目录。
          $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR 'Fonts'
          python -B tools/suite/windows/run_ctest.py --build .tmp/build/windows-release --require-hive --require-storage --require-terminal --require-pageant --require-terminal-ssh --require-sspi-negative
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 只上传明确报告和合法程序，禁止扩为 .tmp 或整个 runtime/cache/hive 树。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: putty-suite-windows-msvc-x64-evidence
          path: |
            .tmp/windows-ci/reports/*.json
            .tmp/windows-ci/reports/*.xml
            .tmp/windows-hive-reports/private-hive.json
            .tmp/windows-storage-reports/private-storage.json
            .tmp/build/windows-release/libs/putty-runtime/tests/suite-windows-handle-tests.exe
            .tmp/build/windows-release/libs/putty-runtime/tests/suite-windows-runtime-tests.exe
            .tmp/build/windows-release/libs/putty-runtime/tests/suite-windows-hive-tests.exe
            .tmp/build/windows-release/libs/putty-runtime/tests/suite-windows-storage-tests.exe
            .tmp/build/windows-release/apps/pageant/tests/pageant-windows-ipc-tests.exe
            .tmp/build/windows-release/apps/putty/tests/putty-sspi-native-negative-tests.exe
            .tmp/windows-ci/install-release/bin/plink.exe
            .tmp/windows-ci/install-release/bin/pscp.exe
            .tmp/windows-ci/install-release/bin/psftp.exe
          if-no-files-found: warn
