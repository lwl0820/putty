name: 套件 Windows 原生检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Server 2022 MSVC x64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PIP_CACHE_DIR: ${{ github.workspace }}\.tmp\pip-cache
      TMP: ${{ github.workspace }}\.tmp\temp
      TEMP: ${{ github.workspace }}\.tmp\temp
    steps:
      - uses: actions/checkout@v4
      - name: 准备项目临时目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force .tmp/temp, .tmp/windows-ci/reports | Out-Null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 固定构建工具版本
        run: python -m pip install cmake==3.30.9 ninja==1.11.1.1
      - name: 检查公共脚本与证据拒绝门
        shell: pwsh
        run: |
          python -B -m unittest discover -s tools/qt/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/suite/windows/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/suite/windows/hive/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 无 Qt 全关闭配置与构建
        shell: pwsh
        run: |
          cmake -S . -B .tmp/build/windows-off -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPUTTY_BUILD_PUTTYGEN=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-off --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 无 Qt CLI-only 多配置安装边界
        shell: pwsh
        run: |
          cmake -S . -B .tmp/build/windows-cli -G "Ninja Multi-Config" -DBUILD_TESTING=OFF -DPUTTY_BUILD_PUTTYGEN=OFF -DPUTTY_BUILD_PSFTP=ON -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-cli --config Debug --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 只有 Debug 时按 Release 安装必须失败，不允许拿错配置凑齐清单。
          cmake --install .tmp/build/windows-cli --config Release --prefix "$PWD/.tmp/windows-ci/install-missing-release"
          if ($LASTEXITCODE -eq 0) { throw "未构建 Release 却安装成功" }
          cmake --install .tmp/build/windows-cli --config Debug --prefix "$PWD/.tmp/windows-ci/install-debug"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/suite/windows/check_build.py --build .tmp/build/windows-cli --prefix .tmp/windows-ci/install-debug --components psftp --configuration Debug --report install-debug.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-cli --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install .tmp/build/windows-cli --config Release --prefix "$PWD/.tmp/windows-ci/install-cli-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/suite/windows/check_build.py --build .tmp/build/windows-cli --prefix .tmp/windows-ci/install-cli-release --components psftp --configuration Release --report install-cli-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v4
        with:
          path: .tmp/qt
          key: qt-6.8.3-windows-msvc2022-x64-${{ hashFiles('tools/qt/qt-sources.json', 'tools/qt/build_qt.py') }}
      - name: 构建锁定 Qt 6.8.3
        shell: pwsh
        run: |
          if (!(Test-Path .tmp/qt/share/puttygen-gui/qt-sources/构建信息.json)) {
            python tools/qt/build_qt.py --prefix .tmp/qt --work .tmp/qt-build --jobs 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 构建共享运行时和三个 CLI
        shell: pwsh
        run: |
          cmake -S . -B .tmp/build/windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="$PWD/.tmp/qt" -DPUTTY_BUILD_PUTTYGEN=OFF -DPUTTY_BUILD_RUNTIME=ON -DPUTTY_BUILD_PLINK=ON -DPUTTY_BUILD_PSCP=ON -DPUTTY_BUILD_PSFTP=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .tmp/build/windows-release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install .tmp/build/windows-release --prefix "$PWD/.tmp/windows-ci/install-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/suite/windows/check_build.py --build .tmp/build/windows-release --prefix .tmp/windows-ci/install-release --components plink pscp psftp --assertions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 执行原生事件与私有 hive 宿主并核对实际结果
        shell: pwsh
        run: |
          $env:PATH = "$PWD/.tmp/qt/bin;$env:PATH"
          python -B tools/suite/windows/run_ctest.py --build .tmp/build/windows-release --require-hive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 只上传明确报告和合法程序，禁止扩为 .tmp 或整个 runtime/cache/hive 树。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: putty-suite-windows-msvc-x64-evidence
          path: |
            .tmp/windows-ci/reports/*.json
            .tmp/windows-ci/reports/*.xml
            .tmp/windows-hive-reports/private-hive.json
            .tmp/build/windows-release/libs/putty-runtime/tests/suite-windows-handle-tests.exe
            .tmp/build/windows-release/libs/putty-runtime/tests/suite-windows-runtime-tests.exe
            .tmp/build/windows-release/libs/putty-runtime/tests/suite-windows-hive-tests.exe
            .tmp/windows-ci/install-release/bin/plink.exe
            .tmp/windows-ci/install-release/bin/pscp.exe
            .tmp/windows-ci/install-release/bin/psftp.exe
          if-no-files-found: warn
